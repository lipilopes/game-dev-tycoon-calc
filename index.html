<html lang="pt-BR">

    <meta charset="UTF-8">

        <title>Game Dev Tycoon</title>
        <style>
          :root {
          --bg-color: #1e1e24;
          --panel-bg: #2b2b36;
          --text-main: #f5f5f5;
          --text-muted: #a0a0a0;
          --accent: #4caf50;
          --border: #3f3f4e;

          --bar-high: #4caf50;
          --bar-med: #ff9800;
          --bar-low: #f44336;
          }

          body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-color: var(--bg-color);
          color: var(--text-main);
          margin: 0;
          padding: 20px;
          display: flex;
          justify-content: center;
          }

          .container {
          max-width: 950px;
          width: 100%;
          background-color: var(--panel-bg);
          border-radius: 10px;
          padding: 30px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          }

          h1 {
          text-align: center;
          margin-top: 0;
          border-bottom: 2px solid var(--border);
          padding-bottom: 15px;
          }

          .form-group {
          margin-bottom: 25px;
          }

          label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: var(--text-muted);
          }

          select {
          width: 100%;
          padding: 12px;
          background-color: var(--bg-color);
          color: var(--text-main);
          border: 1px solid var(--border);
          border-radius: 5px;
          font-size: 16px;
          outline: none;
          }

          select:focus {
          border-color: var(--accent);
          }

          .genres-container {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-bottom: 30px;
          }

          .genre-btn {
          background-color: var(--bg-color);
          color: var(--text-main);
          border: 1px solid var(--border);
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          font-size: 16px;
          transition: all 0.2s ease;
          }

          .genre-btn:hover {
          border-color: var(--accent);
          }

          .genre-btn.active {
          background-color: var(--accent);
          color: white;
          border-color: var(--accent);
          }

          .results-panel {
          display: none;
          animation: fadeIn 0.3s ease;
          }

          .info-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
          margin-bottom: 30px;
          }

          .info-card {
          background-color: var(--bg-color);
          padding: 20px;
          border-radius: 8px;
          border: 1px solid var(--border);
          }

          .info-card h3 {
          margin-top: 0;
          color: var(--accent);
          margin-bottom: 15px;
          }

          .tag-list {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          }

          .tag {
          background-color: var(--panel-bg);
          border: 1px solid var(--border);
          padding: 5px 10px;
          border-radius: 4px;
          font-size: 14px;
          }

          .sliders-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
          }

          .stage-card {
          background-color: var(--bg-color);
          padding: 20px;
          border-radius: 8px;
          border: 1px solid var(--border);
          }

          .slider-row {
          margin-bottom: 15px;
          }

          .slider-label {
          display: flex;
          justify-content: space-between;
          margin-bottom: 5px;
          font-size: 14px;
          }

          .progress-bar {
          width: 100%;
          height: 10px;
          background-color: var(--panel-bg);
          border-radius: 5px;
          overflow: hidden;
          }

          .progress-fill {
          height: 100%;
          border-radius: 5px;
          transition: width 0.5s ease;
          }

          @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
          }

          @media (max-width: 768px) {
          .info-grid, .sliders-grid {
          grid-template-columns: 1fr;
          }
          }
        </style>
      </head>

      "mBox 360":     { generos: { Ação:"+++",  Aventura:"++",  RPG:"+++",  Simulação:"++",   Estratégia:"--",  Casual:"++" },  publico: { I:"+",   T:"++", A:"+++" } },
      "Nuu":          { generos: { Ação:"+",    Aventura:"---", RPG:"--",   Simulação:"+++",  Estratégia:"--",  Casual:"+++" }, publico: { I:"+++", T:"+++",  A:"--"  } },
      "Playsystem 3": { generos: { Ação:"+++",  Aventura:"++",  RPG:"++",   Simulação:"+++",  Estratégia:"--",  Casual:"+" },   publico: { I:"+",   T:"+++",  A:"++"  } },
      "grPhone":      { generos: { Ação:"+",    Aventura:"+",   RPG:"--",   Simulação:"++",   Estratégia:"--",  Casual:"+++" }, publico: { I:"++",  T:"+++",  A:"---" } },
      "grPad":        { generos: { Ação:"--",   Aventura:"++",  RPG:"+",    Simulação:"++",   Estratégia:"--",  Casual:"++" },  publico: { I:"--",  T:"++",   A:"+"   } },
      "mPad":         { generos: { Ação:"--",   Aventura:"++",  RPG:"+",    Simulação:"++",   Estratégia:"--",  Casual:"++" },  publico: { I:"++",  T:"+",    A:"+++" } },
      "Wuu":          { generos: { Ação:"++",   Aventura:"--",  RPG:"+",    Simulação:"+++",  Estratégia:"--",  Casual:"+++" }, publico: { I:"++",  T:"+++",  A:"--"  } },
      "OYA":          { generos: { Ação:"++",   Aventura:"--",  RPG:"+",    Simulação:"++",   Estratégia:"+",   Casual:"+++" }, publico: { I:"+",   T:"+++",  A:"--"  } },
      "mBox One":     { generos: { Ação:"+++",  Aventura:"+",   RPG:"++",   Simulação:"++",   Estratégia:"--",  Casual:"++" },  publico: { I:"--",  T:"+++",  A:"+"   } },
      "Playsystem 4": { generos: { Ação:"+++",  Aventura:"+",   RPG:"+++",  Simulação:"++",   Estratégia:"--",  Casual:"++" },  publico: { I:"+",   T:"+++",  A:"++"  } },
      "mBox Next":    { generos: { Ação:"++",   Aventura:"++",  RPG:"++",   Simulação:"+",    Estratégia:"--",  Casual:"+++" }, publico: { I:"++",  T:"+++",  A:"+" } },
      "Playsystem 5": { generos: { Ação:"+++",  Aventura:"--",  RPG:"++",   Simulação:"+++",  Estratégia:"--",  Casual:"++" },  publico: { I:"+", T:"+++", A:"++" } }
      };

      // Estágios e Sliders da Imagem 3
      const slidersData = {
      "Ação": {
      s1: [ { nome: "Engine", val: 100 }, { nome: "Jogabilidade", val: 75 }, { nome: "História", val: 15 } ],
      s2: [ { nome: "Diálogo", val: 0 }, { nome: "Level Design", val: 75 }, { nome: "IA", val: 100 } ],
      s3: [ { nome: "Mundo", val: 35 }, { nome: "Gráfico", val: 100 }, { nome: "Som", val: 75 } ]
      },
      "Aventura": {
      s1: [ { nome: "Engine", val: 15 }, { nome: "Jogabilidade", val: 35 }, { nome: "História", val: 100 } ],
      s2: [ { nome: "Diálogo", val: 100 }, { nome: "Level Design", val: 35 }, { nome: "IA", val: 15 } ],
      s3: [ { nome: "Mundo", val: 100 }, { nome: "Gráfico", val: 75 }, { nome: "Som", val: 35 } ]
      },
      "RPG": {
      s1: [ { nome: "Engine", val: 15 }, { nome: "Jogabilidade", val: 75 }, { nome: "História", val: 100 } ],
      s2: [ { nome: "Diálogo", val: 100 }, { nome: "Level Design", val: 75 }, { nome: "IA", val: 35 } ],
      s3: [ { nome: "Mundo", val: 100 }, { nome: "Gráfico", val: 75 }, { nome: "Som", val: 35 } ]
      },
      "Simulação": {
      s1: [ { nome: "Engine", val: 75 }, { nome: "Jogabilidade", val: 100 }, { nome: "História", val: 35 } ],
      s2: [ { nome: "Diálogo", val: 15 }, { nome: "Level Design", val: 75 }, { nome: "IA", val: 100 } ],
      s3: [ { nome: "Mundo", val: 35 }, { nome: "Gráfico", val: 100 }, { nome: "Som", val: 75 } ]
      },
      "Estratégia": {
      s1: [ { nome: "Engine", val: 75 }, { nome: "Jogabilidade", val: 100 }, { nome: "História", val: 35 } ],
      s2: [ { nome: "Diálogo", val: 15 }, { nome: "Level Design", val: 100 }, { nome: "IA", val: 75 } ],
      s3: [ { nome: "Mundo", val: 100 }, { nome: "Gráfico", val: 35 }, { nome: "Som", val: 75 } ]
      },
      "Casual": {
      s1: [ { nome: "Engine", val: 0 }, { nome: "Jogabilidade", val: 100 }, { nome: "História", val: 15 } ],
      s2: [ { nome: "Diálogo", val: 15 }, { nome: "Level Design", val: 100 }, { nome: "IA", val: 0 } ],
      s3: [ { nome: "Mundo", val: 15 }, { nome: "Gráfico", val: 100 }, { nome: "Som", val: 75 } ]
      }
      };

      const domTopicSelect = document.getElementById('topic-select');
      const domGenresContainer = document.getElementById('genres-container');
      const domResultsPanel = document.getElementById('results-panel');
      const domAudienceList = document.getElementById('audience-list');
      const domPlatformsList = document.getElementById('platforms-list');
      const domPlatformsAudienceList = document.getElementById('plat-audience-list');
      const domSlidersContainer = document.getElementById('sliders-container');

      // O
      let currentTopic = "";

      const initTopics = () => {
      const sortedTopics = Object.keys(temasData).sort();
      sortedTopics.forEach(topic => {
      const opt = document.createElement('option');
      opt.value = topic;
      opt.textContent = topic;
      domTopicSelect.appendChild(opt);
      });
      };

      domTopicSelect.addEventListener('change', (e) => {
      currentTopic = e.target.value;
      domResultsPanel.style.display = 'none';
      renderGenres(currentTopic);
      });

      const renderGenres = (topic) =>
      {
      domGenresContainer.innerHTML = '';
      const genresMap = temasData[topic].generos;

      // Genero
      Object.entries(genresMap).forEach(([genreName, rating]) =>
      {
      if (rating.includes('+'))
      {
      const btn = document.createElement('button');
      btn.className = 'genre-btn';
      btn.textContent = `${genreName} (${rating})`;

      if (rating === '+++')
      {
      btn.style.borderColor = 'var(--bar-high)';
      }

      btn.addEventListener('click', () =>
      {
      document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderResults(topic, genreName);
      });

      domGenresContainer.appendChild(btn);
      }
      });
      };

      const renderResults = (topic, genre) =>
      {
      domResultsPanel.style.display = 'block';

      // Público
      domAudienceList.innerHTML = '';
      const audienceMap = temasData[topic].publico;
      const audienceLabels  = { 'I': 'Infantil', 'T': 'Todos', 'A': 'Adultos' };
      const perfectAudience = { 'I': '0', 'T': '0', 'A': '0' };

      Object.entries(audienceMap).forEach(([key, rating]) =>
      {
      if (rating.includes('+'))
      {
      const tag       = document.createElement('span');
      tag.className   = 'tag';
      tag.textContent = `${audienceLabels[key]} (${rating})`;

      if (rating === '+++')
      {
      tag.style.borderColor = 'var(--bar-high)';
      tag.style.color = 'var(--bar-high)';
      perfectAudience[key] = 1;
      }

      domAudienceList.appendChild(tag);
      }
      });

      // Plataformas
      domPlatformsList.innerHTML = '';
      domPlatformsAudienceList.innerHTML = '';
      Object.entries(plataformasData).forEach(([platName, platData]) =>
      {
      // Rating
      const platRating    = platData.generos[genre];

      if (platRating === '+++' || platRating === '++')
      {
      const tag = document.createElement('span');

      tag.className = 'tag';

      tag.textContent = `${platName} (${platRating})`;

      if (platRating === '+++')
      {
      tag.style.borderColor = 'var(--bar-high)';
      tag.style.color = 'var(--bar-high)';
      }

      domPlatformsList.appendChild(tag);


      // Audience
      const platAudienceMap  = platData.publico;
      Object.entries(platAudienceMap).forEach(([key, rating]) =>
      {
      if(perfectAudience[key] == 1)
      {
      if (rating === '+++' || rating === '++')
      {
      const tagAud = document.createElement('span');
      tagAud.className   = 'tag';
      tagAud.textContent = `${platName} - ${audienceLabels[key]} (${rating})`;

      if (rating === '+++')
      {
      tagAud.style.borderColor = 'var(--bar-high)';
      tagAud.style.color = 'var(--bar-high)';
      }

      domPlatformsAudienceList.appendChild(tagAud);
      }
      }
      });

      }

      });

      if (domPlatformsList.innerHTML === '') domPlatformsList.innerHTML = '<span class="tag">Nenhuma listada</span>';

      // Filtra Mvp
      // 1. Criamos a constante como um Array (lista) vazio
      const plataformasMvp = [];

      // 2. Pegamos as informações de público do tema selecionado
      const publicoDoTema = temasData[topic].publico;

      // 3. Vasculhamos todas as plataformas disponíveis
      Object.entries(plataformasData).forEach(([platName, platData]) => {
          const notaPlataformaGenero = platData.generos[genre];

          // Regra A: A Plataforma precisa ser '+++' no Gênero
          if (notaPlataformaGenero === '+++') 
          {
            const publicoDaPlataforma = platData.publico;

            const nomesIdade = { 'I': 'Infantil', 'T': 'Todos', 'A': 'Adultos' };

            // Regra B e C: O público da Plataforma e do Tema precisam ser '+++' na mesma faixa (I, T ou A)
            for (let idade in publicoDaPlataforma) 
            {
              if (publicoDaPlataforma[idade] === '+++' && publicoDoTema[idade] === '+++') 
              {

                // Sucesso! Adicionamos o objeto à nossa lista
                plataformasMvp.push({
                  tema: topic,
                  plataforma: platName,
                  genero: genre,
                  idade: nomesIdade[idade]
                });

                // Usamos break para pular para a próxima plataforma e evitar
                // que ela seja adicionada duas vezes se coincidir em duas idades
                break;
              }
            }
         }
      });
      
      // Pegamos a div do HTML
      const domMvpList = document.getElementById('mvp-list');
      const domCardMvp = document.getElementById('card-mvp');

      // Limpamos o resultado anterior
      domMvpList.innerHTML = '';

      if (plataformasMvp.length > 0) {
          // Se encontrou algum MVP, mostra o card
          domCardMvp.style.display = 'block';
          
          // Para cada MVP encontrado na nossa lista, criamos uma tag na tela
          plataformasMvp.forEach(mvp => {
              const tagMvp = document.createElement('span');
              tagMvp.className = 'tag';
              tagMvp.style.backgroundColor = 'var(--bar-high)';
              tagMvp.style.color = 'white';
              
              // Formatando o texto: Tema | Plataforma | Gênero
              tagMvp.textContent = `${mvp.plataforma} - ${mvp.tema} - ${mvp.genero} - ${mvp.idade}`;
        
              domMvpList.appendChild(tagMvp);
          });
      } else {
          // Se não houver plataforma perfeita (MVP) para essa combinação, esconde o card
          domCardMvp.style.display = 'none';
      }


      // Sliders
      domSlidersContainer.innerHTML = '';
      const stages = [
      { title: "Stage 1", data: slidersData[genre].s1 },
      { title: "Stage 2", data: slidersData[genre].s2 },
      { title: "Stage 3", data: slidersData[genre].s3 }
      ];

      stages.forEach(stage => {
      const stageDiv = document.createElement('div');
      stageDiv.className = 'stage-card';

      const title = document.createElement('h3');
      title.textContent = stage.title;
      title.style.marginTop = '0';
      stageDiv.appendChild(title);

      stage.data.forEach(slider => {
      const row = document.createElement('div');
      row.className = 'slider-row';

      let color = 'var(--bar-low)';
      if (slider.val >= 75) color = 'var(--bar-high)';
      else if (slider.val >= 35) color = 'var(--bar-med)';

      row.innerHTML = `
      <div class="slider-label">
        <span>${slider.nome}</span>
        <span>${slider.val}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${slider.val}%; background-color: ${color};"></div>
      </div>
      `;
      stageDiv.appendChild(row);
      });

      domSlidersContainer.appendChild(stageDiv);
      });
      };

      initTopics();
      })();
    </script>
  </body>
</html>
